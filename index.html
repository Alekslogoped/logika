}
const $ = id => document.getElementById(id);
let levelIndex=0, state, history=[], busy=false, highlighted=[], note='', animationToken=0;
let soundEnabled=true,audioContext=null,soundNodes=[];
const reducedMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function driverIcon(panic){

// Короткий комический возглас «у-у, ха-ха» из встроенного синтезатора.
// Звук разблокируется нажатием «Плывём»; запись и внешние файлы не нужны.
function prepareAudio(){
 if(!soundEnabled)return;
 try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;if(!audioContext)audioContext=new Context();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});}catch(_){}
}
function stopSound(){for(const node of soundNodes){try{node.stop();}catch(_){}try{node.disconnect();}catch(_){}}soundNodes=[];}
function playPanic(){
 if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
 stopSound();
 try{
 const ctx=audioContext,base=ctx.currentTime+.03;
 const syllable=(offset,duration,formants,pitch)=>{
  const osc=ctx.createOscillator(),amp=ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(pitch,base+offset);osc.frequency.linearRampToValueAtTime(pitch*.82,base+offset+duration);
  amp.gain.setValueAtTime(0,base+offset);amp.gain.linearRampToValueAtTime(.07,base+offset+.035);amp.gain.setValueAtTime(.055,base+offset+duration*.7);amp.gain.linearRampToValueAtTime(0,base+offset+duration);
  formants.forEach((frequency,i)=>{const filter=ctx.createBiquadFilter(),volume=ctx.createGain();filter.type='bandpass';filter.frequency.value=frequency;filter.Q.value=7;volume.gain.value=[1,.65,.25][i];osc.connect(filter);filter.connect(volume);volume.connect(amp);});
  amp.connect(ctx.destination);osc.start(base+offset);osc.stop(base+offset+duration+.02);soundNodes.push(osc);
 };
 syllable(0,.75,[350,850,2200],235);syllable(.92,.19,[800,1250,2600],265);syllable(1.21,.18,[800,1250,2600],235);syllable(1.5,.23,[800,1250,2600],205);
 }catch(_){/* Ограничение звука в браузере не мешает анимации. */}
}
function toggleSound(){soundEnabled=!soundEnabled;if(!soundEnabled)stopSound();else prepareAudio();$('sound').setAttribute('aria-pressed',String(soundEnabled));$('sound').setAttribute('aria-label',soundEnabled?'Выключить звук':'Включить звук');$('sound').querySelector('.sound-waves').style.opacity=soundEnabled?'1':'.15';}
function failureReason(pair){const i=level().pairs.findIndex(p=>p[0]===pair[0]&&p[1]===pair[1]);return level().reasons[i];}
function clearEffects(){stopSound();$('chaseLayer').replaceChildren();$('lossPanel').hidden=true;document.querySelectorAll('.passenger').forEach(p=>p.style.visibility='');}
async function chasePair(pair,animate=true){
 const layer=$('chaseLayer');layer.replaceChildren();
 const sceneRect=$('scene').getBoundingClientRect();
 const makeActor=(i,role)=>{
  const original=$('scene').querySelector('[data-passenger="'+i+'"]');if(!original)return null;
  const rect=original.querySelector('.emoji svg').getBoundingClientRect(),actor=document.createElement('div');
  actor.className='chase-actor '+role;actor.dataset.actor=i;actor.style.cssText='left:'+(rect.left-sceneRect.left)+'px;top:'+(rect.top-sceneRect.top)+'px;width:'+rect.width+'px;height:'+rect.height+'px;font-size:'+rect.width+'px';
  actor.innerHTML='<div class="runner">'+icon(level().cast[i][0])+'</div><span class="name">'+level().cast[i][1]+'</span>';layer.append(actor);original.style.visibility='hidden';return {actor,rect};
 };
 const target=makeActor(pair[1],'target'),runner=makeActor(pair[0],'attacker');if(!target||!runner)return;
 const dx=target.rect.left-runner.rect.left,dy=target.rect.top-runner.rect.top,distance=Math.hypot(dx,dy)||1;
 const stopAt=Math.min(runner.rect.width*.82,distance*.48),x=dx*(1-stopAt/distance),y=dy*(1-stopAt/distance);
 const pose='translate('+x+'px,'+y+'px)';
 const puff=()=>{const p=document.createElement('div');p.className='chase-puff';p.style.left=(target.rect.left-sceneRect.left+target.rect.width*.35)+'px';p.style.top=(target.rect.top-sceneRect.top+target.rect.height*.6)+'px';layer.append(p);};
 if(!animate||reducedMotion()){runner.actor.style.transform=pose;puff();return;}
 const movement=runner.actor.animate([{transform:'translate(0,0)'},{transform:pose}],{duration:1350,easing:'ease-in-out',fill:'forwards'});
 const bounce=runner.actor.querySelector('.runner').animate([{transform:'translateY(0) rotate(-6deg)'},{transform:'translateY(-9px) rotate(6deg)'},{transform:'translateY(0) rotate(-6deg)'}],{duration:180,iterations:8});
 await movement.finished.catch(()=>{});runner.actor.style.transform=pose;movement.cancel();bounce.cancel();puff();
 await new Promise(resolve=>setTimeout(resolve,350));
}
let progress=[];
try{const saved=JSON.parse(localStorage.getItem('pereprava-v1')||'[]');if(Array.isArray(saved))progress=saved.filter(i=>Number.isInteger(i)&&i>=0&&i<5);}catch(_){/* Игра работает и без хранилища. */}

// Проверка берега, оставленного БЕЗ мальчика. В лодке все под присмотром.
function unsafePairs(positions,farmerBank,config){return config.pairs.filter(([a,b])=>positions[a]!==farmerBank&&positions[b]!==farmerBank&&positions[a]===positions[b]);}
// Поиск кратчайшего безопасного маршрута; используется только для подсказки.
function findRoute(positions,boat,config){
 const queue=[{positions:[...positions],boat,path:[]}],seen=new Set([positions.join('')+boat]);
 for(let head=0;head<queue.length;head++){
  const current=queue[head];if(current.boat===1&&current.positions.every(b=>b===1))return current.path;
  const available=current.positions.map((b,i)=>b===current.boat?i:-1).filter(i=>i!==-1);
  for(let mask=0;mask<(1<<available.length);mask++){
   const passengers=available.filter((_,j)=>mask&(1<<j));if(passengers.length>config.capacity)continue;
   const nextPositions=[...current.positions],nextBoat=1-current.boat;passengers.forEach(i=>nextPositions[i]=nextBoat);
   if(unsafePairs(nextPositions,nextBoat,config).length)continue;
   const key=nextPositions.join('')+nextBoat;if(seen.has(key))continue;seen.add(key);
   queue.push({positions:nextPositions,boat:nextBoat,path:[...current.path,passengers]});
  }
 }
 return null;
}
function saveProgress(){if(!progress.includes(levelIndex))progress.push(levelIndex);try{localStorage.setItem('pereprava-v1',JSON.stringify(progress));}catch(_){} }
function startLevel(index){

 // Не проигрываем обратную анимацию при перезапуске или смене уровня.

}
function togglePassenger(index){

 else if(state.selected.length<level().capacity)state.selected.push(index);

}
function makePassenger(index){
 const [emoji,name]=level().cast[index],button=document.createElement('button');
 button.type='button';button.className='passenger';button.dataset.passenger=index;
 button.style.gridArea=(Math.floor(index/2)+1)+' / '+((index%2)+1);
 button.disabled=busy||state.status!=='idle'||state.positions[index]!==state.boat;
 if(highlighted.includes(index))button.classList.add('hint');
 if(state.status==='error'&&unsafePairs(state.positions,state.boat,level()).some(p=>p.includes(index)))button.classList.add('danger');
 if(state.positions[index]===1)button.classList.add('arrived');
 button.setAttribute('aria-label',name+(button.disabled?' — на другом берегу':' — посадить в лодку'));
 button.innerHTML='<span class="emoji" aria-hidden="true">'+icon(emoji)+'</span><span class="name">'+name+'</span>';

}
function defaultMessage(){
 if(state.status==='won')return 'Все на другом берегу! Отличная работа.';
 if(state.status==='losing')return 'Ой-ой! Посмотри, кто остался без присмотра!';
 if(state.status==='lost')return 'Переправа не удалась. Попробуй ещё раз или верни ход.';
 if(busy)return 'Плывём… Посмотри, кто остался на берегу.';
 if(levelIndex===0&&state.moves===0&&!state.selected.length)return 'Начни с курицы: нажми на неё, а затем на «Плывём».';
 if(state.selected.length)return 'В лодке: '+state.selected.map(i=>level().cast[i][1].toLowerCase()).join(', ')+'. Можно отправляться!';
 return state.boat===1?'Кого заберём обратно? Можно вернуться одному.':'Выбери пассажира. Мальчик может плыть и один.';
}
// Контур берегов на летнем фоне: нормализованные координаты y, левый и правый берег.
const RIVER_BANKS=[[0.35,0.3882,0.5879],[0.36,0.3882,0.6041],[0.37,0.3852,0.6322],[0.38,0.3882,0.6429],[0.39,0.387,0.6651],[0.4,0.3792,0.6687],[0.41,0.3589,0.6663],[0.42,0.3547,0.6722],[0.43,0.3289,0.6824],[0.44,0.323,0.6932],[0.45,0.3062,0.6914],[0.46,0.3152,0.6854],[0.47,0.3236,0.6806],[0.48,0.326,0.6794],[0.49,0.3278,0.6812],[0.5,0.3283,0.6842],[0.51,0.3283,0.683],[0.52,0.3218,0.6794],[0.53,0.3224,0.6866],[0.54,0.3248,0.6998],[0.55,0.3272,0.7004],[0.56,0.3146,0.7057],[0.57,0.317,0.7267],[0.58,0.3044,0.7327],[0.59,0.3074,0.7512],[0.6,0.3008,0.75],[0.61,0.2626,0.7542],[0.62,0.262,0.7518],[0.63,0.2506,0.75],[0.64,0.2524,0.7584],[0.65,0.2536,0.7715],[0.66,0.2476,0.7715],[0.67,0.2398,0.7847],[0.68,0.2416,0.7972],[0.69,0.2416,0.7871],[0.7,0.2291,0.7949],[0.71,0.1986,0.7943],[0.72,0.1974,0.7919],[0.73,0.1788,0.8038],[0.74,0.1788,0.8158],[0.75,0.1711,0.8164],[0.76,0.1728,0.8283],[0.77,0.1722,0.8397],[0.78,0.1579,0.8559],[0.79,0.1256,0.8553],[0.8,0.1094,0.8541],[0.81,0.1077,0.863],[0.82,0.0969,0.8929],[0.83,0.1029,0.9055],[0.84,0.1059,0.9043],[0.85,0.1112,0.9013],[0.86,0.1232,0.8989],[0.87,0.0861,0.9031],[0.88,0.113,0.9169],[0.89,0.1364,0.9252],[0.9,0.1202,0.9516]];
function positionDocks(){
 const scene=$('scene'),hull=$('boat').querySelector('.boat-hull');
 if(!scene||!hull)return;
 const sceneBox=scene.getBoundingClientRect(),boat=$('boat');
 if(!sceneBox.width||!sceneBox.height)return;
 // Используем размеры до покачивания: точки причаливания остаются неподвижными.
 const width=hull.clientWidth,height=hull.clientHeight;
 const scale=Math.min(width/260,height/55),paddingY=(height-55*scale)/2;
 const hullTop=boat.offsetTop+boat.offsetHeight/2-parseFloat(getComputedStyle(hull).bottom)-height;
 const y=(hullTop+paddingY+9*scale)/sceneBox.height;
 const row=Math.max(RIVER_BANKS[0][0],Math.min(RIVER_BANKS[RIVER_BANKS.length-1][0],y));
 let i=0;while(i<RIVER_BANKS.length-2&&RIVER_BANKS[i+1][0]<row)i++;
 const a=RIVER_BANKS[i],b=RIVER_BANKS[i+1],t=(row-a[0])/(b[0]-a[0]);
 const leftBank=(a[1]+(b[1]-a[1])*t)*sceneBox.width,rightBank=(a[2]+(b[2]-a[2])*t)*sceneBox.width;
 const halfHull=127*scale,contact=3;
 scene.style.setProperty('--dock-left',(leftBank+halfHull-contact)+'px');
 scene.style.setProperty('--dock-right',(rightBank-halfHull+contact)+'px');
}
window.addEventListener('resize',()=>requestAnimationFrame(positionDocks),{passive:true});
function render(){
 document.querySelector('.game').classList.toggle('sailing',busy);
 $('chaseLayer').replaceChildren();$('lossPanel').hidden=state.status!=='lost';
 document.querySelector('.game').classList.toggle('lost',state.status==='lost');document.querySelector('.game').classList.toggle('losing',state.status==='losing');
 const c=level();$('levels').replaceChildren();
 LEVELS.forEach((config,index)=>{const b=document.createElement('button');b.type='button';b.className='level'+(index===levelIndex?' active':'')+(progress.includes(index)?' done':'');b.textContent=index+1;b.title=config.title;b.setAttribute('aria-label','Уровень '+(index+1)+': '+config.title);if(index===levelIndex)b.setAttribute('aria-current','step');b.disabled=busy;b.addEventListener('click',()=>startLevel(index));$('levels').append(b);});
 const label=document.createElement('div');label.className='level-title';label.innerHTML=c.title+'<small>'+c.subtitle+'</small>';$('levels').append(label);
 $('capacity').textContent='Мест для пассажиров: '+c.capacity;
 $('counter').textContent='Рейсы: '+state.moves+((levelIndex>=2)?' / цель '+c.target:'');
 $('dangerList').innerHTML=c.pairs.map(([a,b],i)=>'<span class="danger-pill" role="img" aria-label="'+c.reasons[i]+'" title="'+c.reasons[i]+'">'+icon(c.cast[a][0])+'<span>×</span>'+icon(c.cast[b][0])+'</span>').join('');
 $('leftBank').replaceChildren();$('rightBank').replaceChildren();
 c.cast.forEach((_,i)=>{if(!state.selected.includes(i))$(state.positions[i]===0?'leftBank':'rightBank').append(makePassenger(i));});
 $('boat').classList.toggle('right',state.boat===1);
 const panic=state.status==='losing'||state.status==='lost';
 $('crew').innerHTML='<span class="driver'+(panic?' panic':'')+'" role="img" aria-label="'+(panic?'Мальчик хватается за голову':'Мальчик — перевозчик')+'">'+driverIcon(panic)+'</span>';
 for(let slot=0;slot<c.capacity;slot++){
  const i=state.selected[slot],b=document.createElement('button');b.type='button';b.className='seat '+(i===undefined?'empty':'filled');
  b.innerHTML=i===undefined?'+':icon(c.cast[i][0]);b.disabled=i===undefined||busy||state.status!=='idle';
  b.setAttribute('aria-label',i===undefined?'Свободное место':c.cast[i][1]+' — высадить из лодки');
  if(i!==undefined)b.addEventListener('click',()=>togglePassenger(i));$('crew').append(b);
 }
 positionDocks();
 $('boatLabel').textContent=busy?'Переправа…':state.selected.length+' / '+c.capacity+' пассажиров';
 $('message').textContent=note||defaultMessage();
 $('undo').disabled=busy||!history.length;
 $('reset').disabled=busy;$('rules').disabled=busy;
 $('sail').disabled=busy;
 $('sail').hidden=state.status==='lost';
 $('sail').textContent=state.status==='won'?(levelIndex===4?'Ещё раз':'Дальше →'):(state.boat===0?'Плывём →':'← Плывём');
 $('hint').hidden=levelIndex!==0;$('hint').disabled=busy||state.status!=='idle';
 if(levelIndex===0&&state.moves===0&&!state.selected.length&&state.status==='idle'){
  const chicken=$('leftBank').querySelector('[data-passenger="1"]');if(chicken)chicken.classList.add('hint');
 }
 if(state.status==='lost'&&state.attack){$('lossReason').textContent=failureReason(state.attack);chasePair(state.attack,false);}
}
async function sail(){
 if(busy)return;
 if(state.status==='lost')return;
 if(state.status==='won'){startLevel(levelIndex===4?4:levelIndex+1);return;}
 prepareAudio();
 history.push(snapshot());busy=true;note='';highlighted=[];const token=++animationToken;
 const destination=1-state.boat,passengers=[...state.selected],futurePositions=[...state.positions];passengers.forEach(i=>futurePositions[i]=destination);
 const danger=unsafePairs(futurePositions,destination,level())[0];if(danger){state.status='losing';state.attack=danger;}
 render();
 // Даём браузеру показать посадку до движения лодки.
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 $('boat').classList.toggle('right',destination===1);
 if(danger)playPanic();
 await Promise.all([new Promise(resolve=>setTimeout(resolve,reducedMotion()?20:900)),danger?chasePair(danger):Promise.resolve()]);
 if(token!==animationToken)return;
 state.positions=futurePositions;state.boat=destination;state.selected=danger?passengers:[];state.moves++;busy=false;
 if(danger)state.status='lost';
 else if(state.boat===1&&state.positions.every(b=>b===1)){state.status='won';saveProgress();}
 render();if(state.status==='won')showWin();else if(state.status==='lost')$('retry').focus({preventScroll:true});
}
function undo(){
 if(busy||!history.length)return;
 clearEffects();animationToken++;state=history.pop();state.selected=[];state.status='idle';state.attack=null;note='Ход возвращён. Выбери, кого повезти.';highlighted=[];
 $('boat').style.transition='none';render();void $('boat').offsetWidth;$('boat').style.transition='';
 if($('resultDialog').open)$('resultDialog').close();
}
function showRules(){
 const c=level();$('rulesBody').innerHTML='<p class="rule-line">Перевези всех на правый берег. Нажми на пассажира для посадки, затем на «Плывём». Повторный клик высаживает пассажира.</p><p class="rule-line">В лодке мальчик и <b>'+c.capacity+(c.capacity===1?' пассажир':' пассажира')+'</b>. Можно плыть одному и возвращать пассажиров обратно.</p><p class="rule-line"><b>Без мальчика нельзя оставлять вместе:</b></p>'+c.pairs.map(([a,b],i)=>'<div class="rule-pair"><span class="icons">'+icon(c.cast[a][0])+' '+icon(c.cast[b][0])+'</span><span class="explain">'+c.reasons[i]+'</span></div>').join('')+'<p class="rule-line">В присутствии мальчика все в безопасности — и на берегу, и в лодке. Если кто-то остался без присмотра, он подбежит к соседу — игра закончится. Попробуй ещё раз или нажми «Вернуть ход».</p>'+(levelIndex>=2?'<p class="rule-line">Попробуй пройти за <b>'+c.target+' рейсов</b>. Возвращение тоже считается. Если рейсов больше, всё равно можно закончить игру.</p>':'');
 $('rulesDialog').showModal();
}
function showHint(){
 if(busy||state.status!=='idle')return;
 const route=findRoute(state.positions,state.boat,level());if(!route||!route.length)return;
 const next=route[0];highlighted=next;
 note=next.length?'Следующим рейсом возьми: '+next.map(i=>level().cast[i][1].toLowerCase()).join(' и ')+'.':'Следующим рейсом мальчик плывёт один.';render();
}
function showWin(){
 const optimal=state.moves===level().target;
 $('resultTitle').textContent=levelIndex===4&&progress.length===5?'Все пять пройдены!':'Молодец!';
 const reward=(levelIndex>=2&&optimal)?' ⭐ Ты нашёл самый короткий маршрут!':(levelIndex>=2?' Попробуй ещё раз: можно справиться за '+level().target+' рейсов.':'');
 $('resultBody').textContent='Все пассажиры переправлены. Рейсов: '+state.moves+'.'+reward;
 $('next').textContent=levelIndex===4?'К первому уровню':'Следующий уровень →';
 $('resultDialog').showModal();
 for(let i=0;i<28;i++){const piece=document.createElement('i');piece.className='confetti';piece.style.left=(Math.random()*100)+'%';piece.style.background=['#86b4c9','#e9be7a','#c0abd5','#8fbfa9'][i%4];piece.style.animationDelay=(Math.random()*.5)+'s';$('scene').append(piece);setTimeout(()=>piece.remove(),3400);}
}
$('sail').addEventListener('click',sail);$('undo').addEventListener('click',undo);$('reset').addEventListener('click',()=>startLevel(levelIndex));$('rules').addEventListener('click',showRules);$('hint').addEventListener('click',showHint);$('replay').addEventListener('click',()=>startLevel(levelIndex));$('next').addEventListener('click',()=>startLevel(levelIndex===4?0:levelIndex+1));
$('sound').addEventListener('click',toggleSound);$('retry').addEventListener('click',()=>startLevel(levelIndex));$('lossUndo').addEventListener('click',undo);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
startLevel(0);
</script>
